server {
  listen 80;
  server_name _;

  auth_basic "Tournament Admin";
  auth_basic_user_file /etc/nginx/.htpasswd;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
